<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a"/>
  
  <!-- Document/Book -->
  <rect x="120" y="60" width="160" height="140" rx="8" fill="url(#promptGrad)" opacity="0.2"/>
  <rect x="125" y="65" width="150" height="130" rx="6" fill="none" stroke="url(#promptGrad)" stroke-width="3"/>
  
  <!-- Lines representing text -->
  <line x1="145" y1="90" x2="255" y2="90" stroke="#f59e0b" stroke-width="2"/>
  <line x1="145" y1="110" x2="240" y2="110" stroke="#ef4444" stroke-width="2"/>
  <line x1="145" y1="130" x2="250" y2="130" stroke="#f59e0b" stroke-width="2"/>
  <line x1="145" y1="150" x2="235" y2="150" stroke="#ef4444" stroke-width="2"/>
  <line x1="145" y1="170" x2="245" y2="170" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Star (awesome) -->
  <path d="M200 30 L210 50 L232 53 L216 68 L220 90 L200 78 L180 90 L184 68 L168 53 L190 50 Z" 
        fill="#f59e0b"/>
  
  <!-- AI sparkles -->
  <circle cx="90" cy="120" r="4" fill="#f59e0b"/>
  <circle cx="310" cy="120" r="4" fill="#ef4444"/>
  <circle cx="100" cy="160" r="3" fill="#ef4444"/>
  <circle cx="300" cy="160" r="3" fill="#f59e0b"/>
  
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="#f59e0b" text-anchor="middle">Awesome AI Dev</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
        fill="#ef4444" text-anchor="middle">Prompts</text>
</svg>
