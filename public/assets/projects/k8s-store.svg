<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a"/>
  
  <!-- Kubernetes wheel -->
  <circle cx="200" cy="120" r="50" fill="none" stroke="url(#k8sGrad)" stroke-width="3"/>
  <circle cx="200" cy="120" r="10" fill="#3b82f6"/>
  
  <!-- Spokes -->
  <line x1="200" y1="120" x2="200" y2="70" stroke="#3b82f6" stroke-width="3"/>
  <line x1="200" y1="120" x2="243" y2="95" stroke="#3b82f6" stroke-width="3"/>
  <line x1="200" y1="120" x2="243" y2="145" stroke="#3b82f6" stroke-width="3"/>
  <line x1="200" y1="120" x2="200" y2="170" stroke="#3b82f6" stroke-width="3"/>
  <line x1="200" y1="120" x2="157" y2="145" stroke="#3b82f6" stroke-width="3"/>
  <line x1="200" y1="120" x2="157" y2="95" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Pods -->
  <rect x="195" y="65" width="10" height="10" fill="#06b6d4"/>
  <rect x="238" y="90" width="10" height="10" fill="#06b6d4"/>
  <rect x="238" y="140" width="10" height="10" fill="#06b6d4"/>
  <rect x="195" y="165" width="10" height="10" fill="#06b6d4"/>
  <rect x="152" y="140" width="10" height="10" fill="#06b6d4"/>
  <rect x="152" y="90" width="10" height="10" fill="#06b6d4"/>
  
  <!-- Store icons -->
  <rect x="80" y="210" width="30" height="30" rx="3" fill="#3b82f6" opacity="0.6"/>
  <rect x="130" y="210" width="30" height="30" rx="3" fill="#06b6d4" opacity="0.6"/>
  <rect x="180" y="210" width="30" height="30" rx="3" fill="#3b82f6" opacity="0.6"/>
  <rect x="230" y="210" width="30" height="30" rx="3" fill="#06b6d4" opacity="0.6"/>
  <rect x="280" y="210" width="30" height="30" rx="3" fill="#3b82f6" opacity="0.6"/>
  
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
        fill="#3b82f6" text-anchor="middle">K8s Store Platform</text>
</svg>
